       subset is ~22KB; the full family is ~529KB across six files and is loaded

  <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&text=%D8%A7%D8%B1%D8%AF%D9%88%D9%BE%D9%86%D8%AC%D8%A7%D8%A8%DB%8C&display=swap" rel="stylesheet">
